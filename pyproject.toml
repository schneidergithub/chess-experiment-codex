[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-experiment-codex"
version = "0.1.0"
description = "Local-first pipeline to fetch and render the daily Lichess puzzle video (milestone 1)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-chess>=1.999",
    "Pillow>=10.0",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
